# The single source of truth for the project.
# Progress % = Solved / (all problems that are not Parked). It is computed by
# website/build.py, never by hand.
#
# Fields:
#   id          P01, P02, ... (keep ids stable; new problems get the next free id)
#   title       short name of the problem
#   area        Hardware | Firmware | Portal | Website | Safety
#   why         one line: why it matters
#   status      Pending | In progress | Solved | Parked
#   learned     what Irfan learned (filled in when solved)
#   comments    notes, links, open questions
#   date_solved YYYY-MM-DD or empty
#
# Order: easiest first, hardest last. P01-P05 cost nothing.

problems:
  - id: P01
    title: Understand the tracker's block diagram
    area: Hardware
    why: Knowing the main parts and how they talk makes every later step make sense.
    status: Pending
    learned: ""
    comments: Free. Walk through the diagram on the Hardware page together.
    date_solved: ""

  - id: P02
    title: Learn the radio words (LTE-M, NB-IoT, GNSS, WiFi scan, Bluetooth LE)
    area: Hardware
    why: Each radio does one job in the location ladder; mixing them up leads to wrong choices.
    status: Pending
    learned: ""
